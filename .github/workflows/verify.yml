name: independent-proof-replays

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perm3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Replay perm3 certificate
        run: python -B perm3/certificates/verify_all.py

  perm4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Optional perm4 exact checks
        run: python -B perm4/paper/verify_supplementary.py --output perm4-checks.local.json

  perm5:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Optional perm5 exact checks
        run: python -B perm5/paper/verify_supplementary.py --output perm5-checks.local.json

  perm6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Optional perm6 exact checks
        run: python -B perm6/paper/verify_supplementary.py --output perm6-checks.local.json

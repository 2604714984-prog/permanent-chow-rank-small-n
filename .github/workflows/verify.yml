name: exact-proof-replay

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact-replay dependency
        run: python -m pip install -r certificates/requirements-replay.txt
      - name: Replay exact proof certificates
        run: python -B certificates/verify_all.py

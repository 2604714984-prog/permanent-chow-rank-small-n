name: independent-proof-replays

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perm3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Replay perm3 certificate
        run: python -B perm3/certificates/verify_all.py

  perm4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install perm4 replay dependency
        run: python -m pip install -r perm4/certificates/requirements-replay.txt
      - name: Replay perm4 certificates
        run: python -B perm4/certificates/verify_all.py

  perm5:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the perm5 proof computations
        run: python -B perm5/verify_all.py

  perm6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Replay complete perm6 package
        run: python -B perm6/verify_all.py
